<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Videat">
  <title>Videat</title>
  <!-- Full-bleed tile for app icons: the platforms apply their own corner mask -->
  <rect width="96" height="96" fill="#C2321F"/>
  <!-- Slice and play button: Crema. The left edge curves to meet the crust, so no gap shows at the centre. -->
  <path d="M36 27 L71 48 L36 69 Q24 48 36 27 Z" fill="#FFF7EC" stroke="#FFF7EC" stroke-width="10" stroke-linejoin="round"/>
  <!-- Dripping cheese -->
  <path d="M46 62 L46 71 A4 4 0 0 0 54 71 L54 58 Z" fill="#FFF7EC"/>
  <path d="M58 56 L58 63 A3 3 0 0 0 64 63 L64 52 Z" fill="#FFF7EC"/>
  <!-- Crust: Crosta -->
  <path d="M33 19 Q17 48 33 77" fill="none" stroke="#F2C58A" stroke-width="10" stroke-linecap="round"/>
  <!-- Pepperoni: Pomodoro -->
  <circle cx="45" cy="40" r="4.5" fill="#C2321F"/>
  <circle cx="42" cy="54" r="3.5" fill="#C2321F"/>
  <!-- Basil leaf: Basilico -->
  <ellipse cx="55" cy="48" rx="7" ry="3.5" transform="rotate(-28 55 48)" fill="#2F6B4F"/>
</svg>
